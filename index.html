<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e211f">
<title>Ten Minute Loop</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --ground:#f3f2ee; --panel:#ffffff; --ink:#1e211f; --muted:#6b6f6c;
    --line:#dcdbd4; --accent:#2f7d4f; --route:#d93a5a; --danger:#b3261e;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#161817; --panel:#222524; --ink:#f1f1ec; --muted:#a2a6a2;
      --line:#383c3a; --accent:#5fb884; --route:#ff5f7e;
    }
  }
  :root[data-theme="dark"]{
    --ground:#161817; --panel:#222524; --ink:#f1f1ec; --muted:#a2a6a2;
    --line:#383c3a; --accent:#5fb884; --route:#ff5f7e;
  }
  html,body{height:100%;margin:0}
  body{background:var(--ground);color:var(--ink);
    font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;overflow:hidden}
  #map{flex:1;min-height:0;background:var(--ground)}
  .sheet{background:var(--panel);border-top:1px solid var(--line);
    padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));
    display:grid;grid-template-columns:1fr auto;gap:10px 14px;align-items:center}
  .stat{font-size:28px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .stat small{font-size:14px;font-weight:500;color:var(--muted);margin-left:6px}
  .msg{grid-column:1/-1;color:var(--muted);font-size:14px;min-height:1.4em}
  .msg.err{color:var(--danger)}
  .btns{display:flex;gap:8px}
  button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 16px;
    cursor:pointer;background:var(--ink);color:var(--ground);min-height:44px}
  button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
  button:disabled{opacity:.45;cursor:default}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .ctl{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
  .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{background:transparent;color:var(--muted);border:0;border-radius:0;padding:8px 12px;min-height:36px;font-size:14px}
  .seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
  .val{font-weight:700;font-variant-numeric:tabular-nums;min-width:5.5ch;text-align:right}
  input[type=range]{width:100%;accent-color:var(--accent);min-height:36px}
  .leaflet-container{font:inherit}
  .you{width:16px;height:16px;border-radius:50%;background:#1a73e8;
    border:3px solid #fff;box-shadow:0 0 0 2px rgba(26,115,232,.35)}
</style>
</head>
<body>
<div id="map" role="application" aria-label="Map of walking loop"></div>
<div class="sheet">
  <div class="stat" id="stat">—<small>finding you…</small></div>
  <div class="btns">
    <button class="alt" id="center" type="button" disabled>Centre</button>
    <button id="shuffle" type="button" disabled>New loop</button>
  </div>
  <div class="ctl">
    <div class="seg" role="group" aria-label="Set target by">
      <button type="button" id="modeMin" aria-pressed="true">Minutes</button>
      <button type="button" id="modeKm" aria-pressed="false">Km</button>
    </div>
    <input type="range" id="target" min="10" max="120" step="10" value="10" aria-label="Target">
    <span class="val" id="targetVal">10 min</span>
  </div>
  <div class="msg" id="msg">Allow location access when asked.</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
  var PACE_M_PER_MIN = 80;   // ~4.8 km/h, easy walking pace
  // Target set by the slider: minutes (10..120, step 10) or km (1..15, step 1).
  var mode = 'min', minutes = 10, km = 1;
  function TARGET(){ return mode==='min' ? minutes*PACE_M_PER_MIN : km*1000; } // metres
  // Car profile = real streets only. No footpaths, parks, tracks or stairs.
  var ROUTER = 'https://routing.openstreetmap.de/routed-car/route/v1/driving/';
  // Reject a loop if any leg runs along one of these (or an unnamed way).
  var LANE_RE = /\b(lane|laneway|ln|alley|alleyway|walk|path|track|arcade|steps|driveway)\.?$/i;

  var stat = document.getElementById('stat');
  var msg  = document.getElementById('msg');
  var btnShuffle = document.getElementById('shuffle');
  var btnCenter  = document.getElementById('center');
  var slider = document.getElementById('target');
  var sliderVal = document.getElementById('targetVal');
  var btnMin = document.getElementById('modeMin');
  var btnKm  = document.getElementById('modeKm');

  function setMode(m){
    mode=m;
    btnMin.setAttribute('aria-pressed', m==='min');
    btnKm.setAttribute('aria-pressed', m==='km');
    if(m==='min'){ slider.min=10; slider.max=120; slider.step=10; slider.value=minutes; }
    else         { slider.min=1;  slider.max=15;  slider.step=1;  slider.value=km; }
    showTarget();
  }
  function showTarget(){
    sliderVal.textContent = mode==='min' ? minutes+' min' : km+' km';
  }
  function readSlider(){
    var v=Number(slider.value);
    if(mode==='min') minutes=v; else km=v;
    showTarget();
  }

  var map = L.map('map',{zoomControl:false}).setView([-33.87,151.21],15);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19, attribution:'&copy; OpenStreetMap contributors'
  }).addTo(map);

  var here=null, youMarker=null, routeLine=null, startMarker=null, busy=false, queued=false;

  function say(t,err){ msg.textContent=t; msg.className='msg'+(err?' err':''); }
  function showStat(m,min){
    stat.innerHTML = (m/1000).toFixed(2)+' km<small>≈ '+min+' min there and back</small>';
  }

  // Destination point given start, bearing (deg) and distance (m).
  function dest(lat,lon,brg,d){
    var R=6371000, b=brg*Math.PI/180, p1=lat*Math.PI/180, l1=lon*Math.PI/180, ad=d/R;
    var p2=Math.asin(Math.sin(p1)*Math.cos(ad)+Math.cos(p1)*Math.sin(ad)*Math.cos(b));
    var l2=l1+Math.atan2(Math.sin(b)*Math.sin(ad)*Math.cos(p1),Math.cos(ad)-Math.sin(p1)*Math.sin(p2));
    return [p2*180/Math.PI, l2*180/Math.PI];
  }

  function fetchRoute(pts){
    var coords = pts.map(function(p){return p[1]+','+p[0];}).join(';');
    return fetch(ROUTER+coords+'?overview=full&geometries=geojson&steps=true&continue_straight=true')
      .then(function(r){ if(!r.ok) throw new Error('router '+r.status); return r.json(); })
      .then(function(j){ if(!j.routes||!j.routes[0]) throw new Error('no route'); return j.routes[0]; });
  }

  // Full street geometry, stitched from every step (never a simplified overview).
  function routeLatLngs(route){
    var out=[], last=null;
    route.legs.forEach(function(leg){
      leg.steps.forEach(function(st){
        (st.geometry.coordinates||[]).forEach(function(c){
          var k=c[0].toFixed(6)+','+c[1].toFixed(6);
          if(k!==last){ out.push([c[1],c[0]]); last=k; }
        });
      });
    });
    return out;
  }

  // True if any street segment is walked twice (out-and-back spur, or retracing).
  function doublesBack(latlngs){
    var seen={};
    for(var i=1;i<latlngs.length;i++){
      var a=latlngs[i-1].join(','), b=latlngs[i].join(',');
      var key = a<b ? a+'|'+b : b+'|'+a;
      if(seen[key]) return true;
      seen[key]=1;
    }
    return false;
  }

  // True if the route touches a lane, alley or unnamed way.
  function usesLanes(route){
    return route.legs.some(function(leg){
      return leg.steps.some(function(st){
        if(st.maneuver && st.maneuver.type==='arrive') return false;
        var n=(st.name||'').trim();
        return n==='' || LANE_RE.test(n);
      });
    });
  }

  // Loop: a ring of waypoints on a circle that passes through the start,
  // pushed off in a random heading. Route start -> ring -> start.
  // Reject anything that walks a segment twice or touches a lane; grow or
  // shrink the ring until the on-street distance is >= target (never under).
  var RING_PTS = 4;   // waypoints besides the start
  function ringPoints(heading, R){
    var c = dest(here[0],here[1],heading,R);          // circle centre
    var back = heading+180;                            // bearing centre -> start
    var pts=[here];
    for(var k=1;k<=RING_PTS;k++){
      pts.push(dest(c[0],c[1], back + k*360/(RING_PTS+1), R));
    }
    pts.push(here);
    return pts;
  }

  function buildLoop(){
    if(!here) return;
    if(busy){ queued=true; return; }   // slider moved mid-build: rebuild after
    busy=true; btnShuffle.disabled=true;
    say('Plotting a loop…');
    var T=TARGET();
    var headingTries=0;

    function tryHeading(){
      headingTries++;
      var heading=Math.random()*360;
      var R=T/(2*Math.PI)/1.25;     // circumference ≈ T; streets add ~25%
      var attempt=0, best=null;     // best = shortest clean route that is >= T

      function tryOnce(){
        attempt++;
        return fetchRoute(ringPoints(heading,R)).then(function(route){
          var ll=routeLatLngs(route);
          var clean = !usesLanes(route) && !doublesBack(ll);
          var d=route.distance;
          if(clean && d>=T && (!best||d<best.distance)) best={route:route,latlngs:ll};
          if(clean && d>=T && d<=T*1.3) return best;    // good enough, stop
          if(attempt>=3) return best;
          R = R*(T*1.08/Math.max(d,50));                 // aim slightly over
          return tryOnce();
        });
      }
      return tryOnce();
    }

    function go(){
      return tryHeading().then(function(b){
        if(b){ draw(b.route,b.latlngs); return; }
        if(headingTries<6) return go();
        say('No clean street loop found here. Tap New loop to try again.', true);
      });
    }
    go().catch(function(e){
      say('Routing failed. Check signal and tap New loop.', true);
      console.error(e);
    }).finally(function(){
      busy=false; btnShuffle.disabled=false;
      if(queued){ queued=false; buildLoop(); }
    });
  }

  var joinLine=null;
  function draw(route, latlngs){
    if(routeLine) map.removeLayer(routeLine);
    if(joinLine) map.removeLayer(joinLine);
    routeLine = L.polyline(latlngs,{color:'#d93a5a',weight:6,opacity:.9,lineJoin:'round',smoothFactor:0}).addTo(map);
    // dashed tie from where you stand to the street where the loop starts/ends
    joinLine = L.polyline([here, latlngs[0], latlngs[latlngs.length-1], here],
      {color:'#d93a5a',weight:3,opacity:.7,dashArray:'4 8'}).addTo(map);
    if(startMarker) map.removeLayer(startMarker);
    startMarker = L.circleMarker(latlngs[0],{radius:8,color:'#fff',weight:3,fillColor:'#2f7d4f',fillOpacity:1})
      .addTo(map).bindTooltip('Start / finish',{permanent:false});
    map.fitBounds(routeLine.getBounds(),{padding:[30,30]});
    showStat(route.distance, Math.round(route.distance/PACE_M_PER_MIN));
    say('One-way loop, streets only, never under target. Dashed line joins you to the start.');
  }

  function onPos(p){
    var first = !here;
    here=[p.coords.latitude,p.coords.longitude];
    if(!youMarker){
      youMarker=L.marker(here,{icon:L.divIcon({className:'',html:'<div class="you"></div>',iconSize:[16,16],iconAnchor:[8,8]}),
        interactive:false}).addTo(map);
    } else youMarker.setLatLng(here);
    if(first){
      map.setView(here,16);
      btnShuffle.disabled=false; btnCenter.disabled=false;
      buildLoop();
    }
  }
  function onErr(e){
    var t = e.code===1 ? 'Location blocked. Allow location for this site in your browser settings, then reload.'
          : 'Could not get your location. Move somewhere with better signal and reload.';
    say(t,true); stat.innerHTML='—<small>no location</small>';
  }

  if(!navigator.geolocation){ say('This browser has no location support.',true); return; }
  if(location.protocol!=='https:' && location.hostname!=='localhost'){
    say('Location needs HTTPS. Open this page over https.',true);
  }
  navigator.geolocation.getCurrentPosition(onPos,onErr,{enableHighAccuracy:true,timeout:20000,maximumAge:30000});
  navigator.geolocation.watchPosition(onPos,function(){},{enableHighAccuracy:true,maximumAge:5000});

  btnShuffle.addEventListener('click',buildLoop);
  slider.addEventListener('input',readSlider);
  slider.addEventListener('change',function(){ readSlider(); buildLoop(); });
  btnMin.addEventListener('click',function(){ setMode('min'); buildLoop(); });
  btnKm.addEventListener('click',function(){ setMode('km'); buildLoop(); });
  setMode('min');
  btnCenter.addEventListener('click',function(){ if(here) map.setView(here,17); });
})();
</script>
</body>
</html>
